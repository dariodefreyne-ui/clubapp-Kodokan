name: Deploy to Firebase Hosting and Functions

on:
  push:
    branches:
      - main
      - Main
      - claude/kodokan-clubapp-7WpUf
      - claude/kodokan-audit-fixes-iwOJk
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT: club-app-kodokan-merchtem

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for app
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        run: npm install

      - name: Create .env.local from secret
        run: echo "${{ secrets.ENV_LOCAL }}" > .env.local

      # `npm run build` draait eerst de prebuild-stap die
      # public/firebase-messaging-sw.js genereert uit het template en de
      # VITE_FB_* waarden in .env.local (geen hardcoded sleutels in de repo).
      - name: Build app
        run: npm run build

      - name: Setup Google credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLUB_APP_KODOKAN_MERCHTEM }}' > $HOME/firebase-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Firebase Hosting (productie — alleen main)
        if: github.ref == 'refs/heads/Main'
        run: firebase deploy --only hosting --project ${{ env.FIREBASE_PROJECT }}

      - name: Deploy Firebase Hosting (preview — andere branches)
        if: github.ref != 'refs/heads/Main'
        run: |
          CHANNEL="preview-$(echo ${{ github.sha }} | cut -c1-7)"
          DEPLOY_JSON=$(firebase hosting:channel:deploy $CHANNEL --project ${{ env.FIREBASE_PROJECT }} --json 2>/dev/null || echo "{}")
          URL=$(echo "$DEPLOY_JSON" | jq -r '[.result // {} | to_entries[0].value.url] | first // ""')
          echo "Preview URL: $URL"
          echo "preview_url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy Firebase Functions (alleen main)
        if: github.ref == 'refs/heads/Main'
        run: firebase deploy --only functions --project ${{ env.FIREBASE_PROJECT }}

      - name: Deploy Firestore Rules
        if: github.ref == 'refs/heads/Main'
        run: firebase deploy --only firestore:rules --project ${{ env.FIREBASE_PROJECT }}

      - name: Deploy Storage Rules
        if: github.ref == 'refs/heads/Main'
        run: firebase deploy --only storage --project ${{ env.FIREBASE_PROJECT }}
