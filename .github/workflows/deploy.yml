name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - Main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm install

      - name: Create .env.local from GitHub secret
        run: echo "${{ secrets.ENV_LOCAL }}" > .env.local

      - name: Build app
        run: npm run build

      - name: Setup Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/firebase-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV

      - name: Validate service account JSON
        run: |
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync(process.env.HOME + '/firebase-service-account.json', 'utf8');
            let json;
            try {
              json = JSON.parse(raw);
            } catch (e) {
              console.log('::error::Service account file is NOT valid JSON: ' + e.message);
              console.log('File length:', raw.length, 'First char:', JSON.stringify(raw[0]), 'Last char:', JSON.stringify(raw[raw.length - 1]));
              process.exit(1);
            }
            console.log('JSON parsed OK');
            console.log('type:', json.type);
            console.log('project_id:', json.project_id);
            console.log('client_email:', json.client_email);
            console.log('private_key present:', !!json.private_key);
            console.log('private_key looks like real newlines:', json.private_key && json.private_key.includes(String.fromCharCode(10)));
            if (json.project_id !== '${{ secrets.FIREBASE_PROJECT_ID }}') {
              console.log('::warning::project_id in service account (' + json.project_id + ') does not match FIREBASE_PROJECT_ID secret (${{ secrets.FIREBASE_PROJECT_ID }})');
            }
          "

      - name: Install Firebase CLI
        # Versie vastgezet: een ongepinde install pakt de nieuwste npm-release,
        # en 15.22.x regresseerde de auth via GOOGLE_APPLICATION_CREDENTIALS
        # ("Failed to authenticate, have you run firebase login?").
        run: npm install -g firebase-tools@15.20.0

      - name: Verify Firebase auth identity
        run: |
          firebase --version
          firebase projects:list || echo "::warning::firebase projects:list failed, see above for detail"

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Firestore rules
        run: |
          for i in 1 2 3; do
            firebase deploy --only firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), nieuwe poging na 60s..."
            sleep 60
          done

      - name: Deploy Firestore indexes
        run: |
          for i in 1 2 3; do
            firebase deploy --only firestore:indexes --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), nieuwe poging na 60s..."
            sleep 60
          done

      - name: Deploy Storage rules
        run: |
          for i in 1 2 3; do
            firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), nieuwe poging na 60s..."
            sleep 60
          done

      - name: Deploy Cloud Functions
        run: |
          for i in 1 2 3; do
            firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), nieuwe poging na 60s..."
            sleep 60
          done

      - name: Deploy Hosting
        run: |
          for i in 1 2 3; do
            firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), nieuwe poging na 60s..."
            sleep 60
          done
