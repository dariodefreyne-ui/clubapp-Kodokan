name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - Main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm install

      - name: Create .env.local from GitHub secret
        run: echo "${{ secrets.ENV_LOCAL }}" > .env.local

      - name: Build app
        run: npm run build

      - name: Setup Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/firebase-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV

      - name: Install Firebase CLI
        # 15.20.0 was eerder vastgepind tegen een auth-regressie in 15.22.0/15.22.1.
        # Die regressie is gefixt in 15.22.2/15.22.3 ("Premature close" tijdens
        # OAuth-token-fetch door keep-alive uitgeschakeld in google-auth-library),
        # wat ook de oorzaak was van de "Failed to authenticate" fout op 15.20.0
        # zelf (Node-runtime keep-alive regressie, niet versie-specifiek aan firebase-tools).
        run: npm install -g firebase-tools@15.22.3

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Firestore rules
        run: |
          for i in 1 2 3; do
            firebase deploy --only firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), nieuwe poging na 60s..."
            sleep 60
          done

      - name: Deploy Firestore indexes
        run: |
          for i in 1 2 3; do
            firebase deploy --only firestore:indexes --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), nieuwe poging na 60s..."
            sleep 60
          done

      - name: Deploy Storage rules
        run: |
          for i in 1 2 3; do
            firebase deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), nieuwe poging na 60s..."
            sleep 60
          done

      - name: Deploy Cloud Functions
        run: |
          for i in 1 2 3; do
            firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), nieuwe poging na 60s..."
            sleep 60
          done

      - name: Deploy Hosting
        run: |
          for i in 1 2 3; do
            firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ "$i" = "3" ]; then exit 1; fi
            echo "Deploy mislukt (poging $i/3), nieuwe poging na 60s..."
            sleep 60
          done
