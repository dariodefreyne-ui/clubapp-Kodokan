name: Deploy to Firebase Hosting and Functions

on:
  push:
    branches:
      - main
      - claude/kodokan-clubapp-7WpUf
      - claude/debug-app-startup-R761F
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for app
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Setup Google credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLUB_APP_KODOKAN_MERCHTEM }}' > $HOME/firebase-service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project club-app-kodokan-merchtem

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --force --project club-app-kodokan-merchtem

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project club-app-kodokan-merchtem
